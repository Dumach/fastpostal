[project]
name = "fastpostal"
version = "1.0.0"
description = "FastAPI server for parsing addresses with libpostal"
readme = "README.md"
authors = [
    { name = "Alex Nagy", email = "nagyalex003@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "slowapi>=0.1.9",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "postal>=1.1.11",
]

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.0.0",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build >= 0.11.21, <0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
