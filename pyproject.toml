[project]
name = "libpostal-server"
version = "1.0.0"
description = "FastAPI server for parsing addresses with libpostal"
readme = "README.md"
authors = [
    { name = "Alex Nagy", email = "nagyalex003@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "slowapi>=0.1.9",
    "pydantic>=2.10.0",

    "python-dotenv>=1.0.0",
]

[project.scripts]
libpostal-server = "libpostal_server.main:run"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
